name: reaper

# Safety net: destroys every demo stack nightly so nothing survives a forgotten
# recording. Uses the `demo-reaper` environment, which has NO required reviewer
# (a scheduled job cannot wait for an approval click). It can only destroy
# what the demo stacks contain; it cannot create anything because the workflow
# only ever runs `terraform destroy`.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  reap:
    runs-on: ubuntu-latest
    env:
      TF_VAR_expected_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
    environment: demo-reaper
    strategy:
      matrix:
        demo: [bedrock-agent]
    defaults:
      run:
        working-directory: demos/${{ matrix.demo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_APPLY_ARN }}
          aws-region: us-east-1
      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=demos/${{ matrix.demo }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
      - name: Destroy (idempotent)
        run: terraform destroy -auto-approve -input=false -var="foundation_model=${{ vars.FOUNDATION_MODEL }}"
