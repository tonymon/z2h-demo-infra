name: demo-up

# Manual only. The `demo` environment must have a required reviewer (you), so
# nothing is created in AWS without an explicit approval click.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  up:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TF_VAR_expected_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
    environment: demo
    defaults:
      run:
        working-directory: demos/bedrock-agent
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_APPLY_ARN }}
          aws-region: us-east-1
      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=demos/bedrock-agent/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
      - name: Apply
        run: terraform apply -auto-approve -input=false -var="foundation_model=${{ vars.FOUNDATION_MODEL }}"
      - name: Outputs
        run: terraform output
